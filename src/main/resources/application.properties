spring.application.name=mecanicadm-workorder-api

server.servlet.context-path=/api

spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:mecanicadm_workorder}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=validate
spring.messages.encoding=UTF-8
spring.messages.basename=i18n/messages
spring.flyway.enabled=true
spring.flyway.clean-disabled=true

api.security.token.secret=${JWT_SECRET:development}

cors.allowed-origins=*

# Habilita os endpoints de Liveness e Readiness do Kubernetes
management.endpoint.health.probes.enabled=true
# Expõe os endpoints via Web
management.endpoints.web.exposure.include=health,info,prometheus
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

server.error.include-stacktrace=never

springdoc.swagger-ui.docExpansion=none
springdoc.swagger-ui.tagsSorter=alpha

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:username}
spring.mail.password=${MAIL_PASSWORD:password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
