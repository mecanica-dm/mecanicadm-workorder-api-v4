services:
  db:
    image: postgres:15-alpine
    container_name: mecanicadm-workorder-api-v4-db
    ports:
      - "${WORKORDER_DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - POSTGRES_DB=${POSTGRES_DB:-workorder_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-workorder_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    profiles: [ "broker" ]
    container_name: mecanicadm-workorder-api-v4-rabbitmq
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${BROKER_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${BROKER_PASSWORD:-guest}
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq-init:
    profiles: [ "broker" ]
    container_name: mecanicadm-workorder-api-v4-rabbitmq-init
    image: curlimages/curl:8.10.1
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./messaging/workorder-definitions.json:/definitions.json:ro
    entrypoint: [ "sh", "-c" ]
    command:
      - >
        curl -sf --retry 10 --retry-delay 3 --retry-connrefused
        -u "${BROKER_USER:-guest}:${BROKER_PASSWORD:-guest}"
        -H "content-type: application/json"
        -X POST http://rabbitmq:15672/api/definitions
        --data @/definitions.json
        && echo "Topologia da workorder aplicada"
    restart: "no"

  api:
    build: .
    container_name: mecanicadm-workorder-api-v4
    ports:
      - "${WORKORDER_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-default}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-workorder_db}
      - DB_USER=${POSTGRES_USER:-admin}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - JWT_SECRET=${JWT_SECRET:-development}
      - RABBITMQ_HOST=${BROKER_HOST:-host.docker.internal}
      - RABBITMQ_PORT=${BROKER_PORT:-5672}
      - RABBITMQ_USER=${BROKER_USER:-guest}
      - RABBITMQ_PASSWORD=${BROKER_PASSWORD:-guest}
      - RABBITMQ_VHOST=${BROKER_VHOST:-/}
      - RABBITMQ_SSL_ENABLED=${BROKER_SSL_ENABLED:-false}
      - OUTBOX_PUBLISHER_INTERVAL_MS=${OUTBOX_PUBLISHER_INTERVAL_MS:-1000}
      - OUTBOX_BATCH_SIZE=${OUTBOX_BATCH_SIZE:-50}
      - OUTBOX_RETENTION_DAYS=${OUTBOX_RETENTION_DAYS:-7}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health/liveness | grep -q UP" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  seeder:
    image: postgres:15-alpine
    container_name: mecanicadm-workorder-api-v4-seeder
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./docker/database/init.sql:/seed/init.sql:ro
    command: >
      sh -c '
        until PGPASSWORD=${POSTGRES_PASSWORD:-admin} psql -h db -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-workorder_db} -tAc "SELECT 1 FROM flyway_schema_history WHERE success = true AND script = '\''V14__create_work_order_status_history.sql'\''" | grep -q 1; do
          echo "Aguardando o Flyway concluir as migrations...";
          sleep 3;
        done;

        echo "Flyway concluido! Rodando o init.sql...";
        PGPASSWORD=${POSTGRES_PASSWORD:-admin} psql -h db -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-workorder_db} -v ON_ERROR_STOP=1 -f /seed/init.sql
      '
    restart: "no"

volumes:
  postgres_data:
