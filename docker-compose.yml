services:
  api:
    build: .
    container_name: mecanicadm-workorder-api
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-default}
      - DB_HOST=${DB_HOST_EXTERNAL:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${POSTGRES_DB:-workorder_db}
      - DB_USER=${POSTGRES_USER:-admin}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - JWT_SECRET=${JWT_SECRET:-development}
      - RABBITMQ_HOST=${RABBITMQ_HOST_EXTERNAL:-host.docker.internal}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - OUTBOX_PUBLISHER_INTERVAL_MS=${OUTBOX_PUBLISHER_INTERVAL_MS:-1000}
      - OUTBOX_BATCH_SIZE=${OUTBOX_BATCH_SIZE:-50}
      - OUTBOX_RETENTION_DAYS=${OUTBOX_RETENTION_DAYS:-7}

  seeder:
    image: postgres:15-alpine
    container_name: mecanicadm-workorder-seeder
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=${DB_HOST_EXTERNAL:-host.docker.internal}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - POSTGRES_DB=${POSTGRES_DB:-workorder_db}
    volumes:
      - ./docker/database/init.sql:/seed/init.sql:ro
    command: >
      sh -c '
        until PGPASSWORD="$$POSTGRES_PASSWORD" psql -h "$$DB_HOST" -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc "SELECT 1 FROM flyway_schema_history WHERE success = true AND script = '\''V13__work_orders_requested_changes.sql'\''" 2>/dev/null | grep -q 1; do
          echo "Aguardando o banco e as migrations do Flyway...";
          sleep 3;
        done;

        echo "Flyway concluído! Rodando o init.sql...";
        PGPASSWORD="$$POSTGRES_PASSWORD" psql -h "$$DB_HOST" -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v ON_ERROR_STOP=1 -f /seed/init.sql
      '
