apiVersion: apps/v1
kind: Deployment
metadata:
  name: mecanicadm
  namespace: mecanicadm
  labels:
    app.kubernetes.io/name: mecanicadm
    app.kubernetes.io/instance: mecanicadm
    app.kubernetes.io/version: "0.0.1-SNAPSHOT"
    app.kubernetes.io/part-of: mecanicadm
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mecanicadm
      app.kubernetes.io/instance: mecanicadm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mecanicadm
        app.kubernetes.io/instance: mecanicadm
        app.kubernetes.io/part-of: mecanicadm
    spec:
      serviceAccountName: mecanicadm
      initContainers:
        - name: newrelic-agent
          image: busybox:1.36
          command:
            - sh
            - -c
            - wget -q -O /newrelic/newrelic.jar https://repo1.maven.org/maven2/com/newrelic/agent/java/newrelic-agent/8.15.0/newrelic-agent-8.15.0.jar
          volumeMounts:
            - name: newrelic-agent
              mountPath: /newrelic
      containers:
        - name: mecanicadm
          image: diegopriess/mecanica-dm:prod-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef:
                name: mecanicadm-config
            - secretRef:
                name: mecanicadm-db-secrets
            - secretRef:
                name: mecanicadm-secrets
          env:
            - name: JAVA_OPTS
              value: "-javaagent:/newrelic/newrelic.jar"
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: mecanicadm-secrets
                  key: NEW_RELIC_LICENSE_KEY
            - name: NEW_RELIC_APP_NAME
              value: "mecanica-dm-api"
            - name: NEW_RELIC_LOG_LEVEL
              value: "info"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: newrelic-agent
              mountPath: /newrelic
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2000m"
              memory: 1024Mi
          startupProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
        - name: newrelic-agent
          emptyDir: {}
