apiVersion: v1
kind: ConfigMap
metadata:
  name: mecanicadm-config
  namespace: mecanicadm
  labels:
    app.kubernetes.io/name: mecanicadm
    app.kubernetes.io/instance: mecanicadm
    app.kubernetes.io/part-of: mecanicadm
data:
  SPRING_PROFILES_ACTIVE: "prod"

  MAIL_HOST: "smtp.gmail.com"
  MAIL_PORT: "587"
  MAIL_SMTP_AUTH: "true"
  MAIL_SMTP_STARTTLS: "true"

  BUDGET_BASE_URL: "https://api.mecanicadm.com.br/api"
