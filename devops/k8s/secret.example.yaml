# Exemplo das credenciais do banco usadas pela API e pelo Job de seed.
#
# NÃO aplique este arquivo: a pipeline (app-deploy.yml) cria o Secret
# "mecanicadm-db-secrets" lendo os valores publicados no SSM pelo Terraform
# (devops/terraform). Use este arquivo apenas como referência para depuração
# local ou para recriar o Secret manualmente.
#
# Parâmetros SSM:
#   /mecanicadm/prod/workorder/db_host
#   /mecanicadm/prod/workorder/db_port
#   /mecanicadm/prod/workorder/db_name
#   /mecanicadm/prod/workorder/db_user
#   /mecanicadm/prod/workorder/db_password
apiVersion: v1
kind: Secret
metadata:
  name: mecanicadm-db-secrets
  namespace: mecanicadm
  labels:
    app.kubernetes.io/name: mecanicadm
    app.kubernetes.io/instance: mecanicadm
    app.kubernetes.io/part-of: mecanicadm
type: Opaque
stringData:
  DB_HOST: "<rds-endpoint>"
  DB_PORT: "5432"
  DB_NAME: "workorder_db"
  DB_USER: "workorder_admin"
  DB_PASSWORD: "<senha-do-rds>"
