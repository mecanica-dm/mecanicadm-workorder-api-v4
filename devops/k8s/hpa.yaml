apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mecanicadm
  namespace: mecanicadm
  labels:
    app.kubernetes.io/name: mecanicadm
    app.kubernetes.io/instance: mecanicadm
    app.kubernetes.io/part-of: mecanicadm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mecanicadm
  minReplicas: 2
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
