name: DESTROY - Workorder DB + Secrets (botão vermelho)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Digite DESTRUIR para confirmar"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Compartilhado com o terraform.yml: nunca apply e destroy ao mesmo tempo.
  group: terraform-workorder-prod
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'mecanicadm-v4-01' }}
  TF_STATE_KEY: terraform/mecanicadm-workorder/terraform.tfstate
  TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30

    if: inputs.confirmation == 'DESTRUIR'

    defaults:
      run:
        working-directory: devops/terraform

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configura credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup do Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.4"

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_DEFAULT_REGION}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="use_lockfile=true"

      # Os data sources (VPC, SGs e subnets) leem parâmetros publicados pelo
      # mecanicadm-infra-v4. O destroy deste stack precisa que a infra ainda exista.
      - name: Terraform Destroy
        run: terraform destroy -auto-approve -input=false -no-color

      # A deleção do RDS e dos secrets é síncrona no destroy, mas listamos
      # qualquer resíduo para conferência manual.
      - name: Verifica órfãos (informativo)
        if: always()
        run: |
          echo "=== Instâncias RDS restantes ==="
          aws rds describe-db-instances \
            --query 'DBInstances[?starts_with(DBInstanceIdentifier, `mecanicadm-`)].DBInstanceIdentifier' \
            --output table 2>/dev/null || true
          echo "=== Secrets restantes (mecanicadm/) ==="
          aws secretsmanager list-secrets \
            --filters Key=name,Values=mecanicadm/ \
            --query 'SecretList[].Name' \
            --output table 2>/dev/null || true
          echo ">>> Se aparecer algo acima, apague manualmente pelo console."
